<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Website Chat — Control Panel</title>
  <style>
    body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;max-width:620px;margin:40px auto;padding:0 20px;color:#24292f}
    h1{font-size:22px} h2{font-size:15px;margin-top:26px;border-bottom:1px solid #eaecef;padding-bottom:6px}
    label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
    .hint{font-weight:400;color:#6a737d;font-size:12px}
    input[type=text],input[type=number]{width:100%;box-sizing:border-box;padding:9px;border:1px solid #d0d7de;border-radius:7px;font-size:14px}
    .row{display:flex;align-items:center;gap:8px;margin:10px 0}
    .row input[type=checkbox]{width:18px;height:18px}
    button{margin-top:22px;background:#1f6feb;color:#fff;border:none;border-radius:8px;padding:11px 18px;font-size:15px;cursor:pointer}
    #status{margin-left:12px;font-size:14px}
    .card{background:#f6f8fa;border:1px solid #eaecef;border-radius:10px;padding:16px}
  </style>
</head>
<body>
  <h1>Website Chat — Control Panel</h1>
  <p class="hint">Change who answers and how the chat behaves. Runs on any PC — no code needed.</p>

  <div class="card">
    <label>Admin key <span class="hint">(the ADMIN_KEY you set in Vercel; leave blank in local testing)</span></label>
    <input type="text" id="adminKey" placeholder="admin key" />
    <button onclick="load()">Load settings</button>
    <span id="status"></span>
  </div>

  <div id="form" style="display:none">
    <h2>Where questions go</h2>
    <label>Slack channel ID <span class="hint">(the #website-chat channel, e.g. C0BQ4R57NSF)</span></label>
    <input type="text" id="channelId" />

    <h2>Behavior</h2>
    <label>Minutes to wait for a technician before the AI answers</label>
    <input type="number" id="timeoutMin" min="1" max="60" />
    <div class="row"><input type="checkbox" id="afterHoursAI" /><label style="margin:0">Outside business hours, let the AI answer right away</label></div>
    <div class="row"><input type="checkbox" id="aiDraftToSlack" /><label style="margin:0">Send the technician an AI-suggested answer to speed replies</label></div>
    <div class="row"><input type="checkbox" id="aiFallback" /><label style="margin:0">Let the AI answer if no one replies in time</label></div>
    <div class="row"><input type="checkbox" id="leadCapture" /><label style="margin:0">Ask visitors for their name + contact (lead capture)</label></div>

    <h2>Business hours <span class="hint">(when a technician is watching Slack)</span></h2>
    <label>Open (24h, e.g. 09:00)</label><input type="text" id="open" />
    <label>Close (24h, e.g. 18:00)</label><input type="text" id="close" />

    <h2>Messages</h2>
    <label>Greeting</label><input type="text" id="greeting" />
    <label>"Please wait" message</label><input type="text" id="waitingMessage" />

    <button onclick="save()">Save changes</button>
  </div>

<script>
var S = {};
function hdr(){ var k=document.getElementById('adminKey').value; return k?{'X-Admin-Key':k}:{}; }
function load(){
  fetch('/api/config',{headers:hdr()}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(s){ S=s; document.getElementById('form').style.display='block'; document.getElementById('status').textContent='loaded';
    channelId.value=s.channelId||''; timeoutMin.value=Math.round((s.timeoutSeconds||240)/60);
    afterHoursAI.checked=!!s.afterHoursAI; aiDraftToSlack.checked=!!s.aiDraftToSlack; aiFallback.checked=!!s.aiFallback; leadCapture.checked=!!s.leadCapture;
    open.value=(s.businessHours&&s.businessHours.open)||'09:00'; close.value=(s.businessHours&&s.businessHours.close)||'18:00';
    greeting.value=s.greeting||''; waitingMessage.value=s.waitingMessage||'';
  }).catch(function(e){ document.getElementById('status').textContent='error: '+e.message+' (check admin key)'; });
}
function save(){
  var bh=Object.assign({},S.businessHours||{},{open:open.value,close:close.value});
  var patch={channelId:channelId.value,timeoutSeconds:Math.max(60,(+timeoutMin.value||4)*60),
    afterHoursAI:afterHoursAI.checked,aiDraftToSlack:aiDraftToSlack.checked,aiFallback:aiFallback.checked,leadCapture:leadCapture.checked,
    businessHours:bh,greeting:greeting.value,waitingMessage:waitingMessage.value};
  fetch('/api/config',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},hdr()),body:JSON.stringify(patch)})
  .then(function(r){ return r.json(); }).then(function(){ document.getElementById('status').textContent='saved ✓'; })
  .catch(function(e){ document.getElementById('status').textContent='save error: '+e.message; });
}
</script>
</body>
</html>
